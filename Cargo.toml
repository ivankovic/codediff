[package]
name = "codediff"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fast, robust, syntax-aware code diffing using tree-sitter ASTs"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ivankovic/codediff"
readme = "README.md"
keywords = ["diff", "ast", "tree-sitter", "cli", "git"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
# An allow-list, not an `exclude`: the checkout carries far more than the crate (the fixture
# corpus, research/, packaging recipes, working notes), and a new file at the root would otherwise
# ship by default. `src/test/*.rs` stays because `mod test` compiles under `cfg(test)`; its data
# under `src/test/data/` does not, so `cargo install codediff --features test-fixtures` fails with
# a "no such bin target" error rather than building the checkout-only dev tools. `assets/web/` is
# `include_str!`-ed by src/web/server.rs; the two images are the README's.
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/assets/readme-screenshot.png",
    "/assets/diff-vs-codediff.gif",
    "/assets/web/*.html",
    "/assets/web/*.js",
    "/assets/web/*.css",
    "!/assets/web/*.test.js",
    "/src/**/*.rs",
    "!/src/bin/**",
    "!/src/test/data/**",
]

# docs.rs documents the viewers too: `web` implies `tui`, and neither adds a build dependency
# docs.rs lacks. `stats` is left out (git2's OpenSSL/libssh2 build).
[package.metadata.docs.rs]
features = ["web"]

# `cargo binstall codediff`: the release workflow's asset names, as release.yml packages them -
# `codediff-<target>.tar.gz` with the binary at the archive root, `.zip` for Windows.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# A CPU-bound tool gains from optimizing across crates (tree-sitter, the engine's modules), at the
# cost of slower release builds.
[profile.release]
lto = "fat"
codegen-units = 1

# Debian packaging by `cargo deb` (`cargo install cargo-deb`), producing an unofficial .deb for the
# GitHub release. Debian proper would first need every dependency packaged as `librust-*-dev`,
# tree-sitter grammars included, which is not reachable. See packaging/README.md.
[package.metadata.deb]
maintainer = "Marko Ivankovic <marko@ivankovic.me>"
copyright = "2026 Marko Ivankovic"
license-file = ["LICENSE", "0"]
extended-description = """
CodeDiff parses both sides of a diff with tree-sitter and matches their syntax \
trees, so a change is reported as what it structurally is - an insertion, \
deletion, update, or move - rather than as whichever lines happened to align. \
It runs as an interactive terminal UI, a plain-text batch formatter, or a JSON \
emitter for editor integrations, and works as a git difftool backend and a \
Jujutsu (jj) diff formatter."""
section = "devel"
priority = "optional"
# `$auto` lets cargo-deb read the built binary's actual ELF dependencies (libc, libgcc) rather than
# guessing. Every tree-sitter grammar is compiled in statically, so there is nothing else to name.
depends = "$auto"
assets = [
    ["target/release/codediff", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/codediff/README.md", "644"],
    # Generated by `codediff util man` / `util completions` before packaging (release.yml's `deb`
    # job): cargo-deb cannot run the binary, and a missing file fails the build, as intended.
    ["target/dist/codediff.1", "usr/share/man/man1/", "644"],
    ["target/dist/codediff.bash", "usr/share/bash-completion/completions/codediff", "644"],
    ["target/dist/_codediff", "usr/share/zsh/vendor-completions/", "644"],
    ["target/dist/codediff.fish", "usr/share/fish/vendor_completions.d/", "644"],
]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.6", features = ["derive"] }
# `codediff util completions`/`util man`, only in src/main.rs, so gated by `tui` to keep a
# `default-features = false` library consumer free of them.
clap_complete = { version = "4.6.9", optional = true }
# clap_mangen 0.3 requires clap >= 4.6.6, which is why clap's own floor above is 4.6.6 rather
# than lower: the declared floor must be the effective one.
clap_mangen = { version = "0.3.3", optional = true }
# TUI-only, and src/bin/human_solver/'s debug UI - gated by `tui`.
confy = { version = "2.0.0", optional = true }
# Only used by src/stats/ (feature-gated) and the stats-gated src/bin/ tools that need concurrent
# filesystem walks (file_stats.rs, commit_stats.rs) - gated the same way as git2/rusqlite below.
crossbeam-channel = { version = "0.5.15", optional = true }
# Used by the stats-gated dev tools and the three test-fixture-only ones, so gated by
# `test-fixtures`, which `stats` includes.
csv = { version = "1.4.0", optional = true }
git2 = { version = "0.21", optional = true }
# Only used by src/stats.rs itself - gated the same way as the rest of the stats-only deps.
indoc = { version = "2.0.7", optional = true }
# Only used by src/bin/file_stats.rs (stats-gated).
libc = { version = "0.2", optional = true }
# Only used by src/bin/file_stats.rs and commit_stats.rs (both stats-gated).
num_cpus = { version = "1.17.0", optional = true }
# Only used by src/stats/sampling.rs (feature-gated) and the stats-gated sample_*.rs dev tools.
rand = { version = "0.10", optional = true }
# Only used by src/stats.rs and the fixture-loading helpers under src/test/ (`test-fixtures`);
# also a dev-dependency below because those helpers compile under a plain `cargo test` too.
regex = { version = "1.12.2", optional = true }
# Terminal cell widths for `text_range::ScreenColumn`, needed outside the TUI too (headless). Already
# in the lockfile via ratatui.
unicode-width = "0.2"
# Bundled, C-compiled SQLite, only for the stats-gated commit_stats.rs and file_stats.rs.
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
# Only used by tests and the `test-fixtures` helpers - gated like regex above, for the same reason.
tempfile = { version = "3.10.1", optional = true }
# TUI-only (the event stream) - gated by `tui`.
futures = { version = "0.3", optional = true }
# TUI-only, and src/bin/commit_stats.rs's concurrent I/O - gated by `tui`.
tokio = { version = "1.0", features = ["full"], optional = true }
tree-sitter = "0.25"
# TUI-only, and src/bin/human_solver/'s debug UI - gated by `tui`.
ratatui = { version = "0.30.2", features = ["serde", "macros"], optional = true }
crossterm = { version = "0.29.0", features = ["serde", "event-stream"], optional = true }
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-r = "1.3"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-vim = "0.4"
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7"
# Only used by src/stats/filesystem.rs - gated by `stats`.
walkdir = { version = "2", optional = true }
metrohash = "1.0.7"
rustc-hash = "2.1"
# All three TUI-only (src/tui.rs sets up the subscriber, src/tui/app.rs logs) - gated by `tui`.
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "serde"], optional = true }
tracing-error = { version = "0.2.1", optional = true }
strum = { version = "0.28.0", features = ["derive"] }
syntect = { version = "5.2", features = ["default-fancy"], optional = true }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"], optional = true }

# Unix only, for `libc::raise(SIGTSTP)` in `tui::app::suspend` (Ctrl-Z). Already a transitive
# dependency of tokio and crossterm, so it adds no crate to the tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The same two crates the `test-fixtures` feature enables, for the `#[cfg(test)]` builds that
# compile src/test/ without that feature (see lib.rs's gate on `mod test`).
regex = "1.12.2"
tempfile = "3.10.1"

[features]
# A bare `cargo install codediff` builds the TUI binary; a library consumer opts out with
# `default-features = false`.
default = ["tui"]
# Everything the TUI (src/tui/, src/main.rs) needs. Every dev-tool feature implies it: some of those
# bins use these deps directly, and tracking which ones is not worth it.
tui = [
    "dep:clap_complete",
    "dep:clap_mangen",
    "dep:ratatui",
    "dep:crossterm",
    "dep:tokio",
    "dep:syntect",
    "dep:two-face",
    "dep:confy",
    "dep:futures",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-error",
]
# Gates `codediff::test`, whose data files are excluded from the published crate, so it must not
# be public API there. Needed by every src/bin/ dev tool; `stats` includes it.
test-fixtures = ["dep:csv", "dep:regex", "dep:tempfile", "tui"]
# git2 (with its OpenSSL/libssh2 build), bundled SQLite and the rest of the history
# stats/sampling tools' deps. Opt-in, so `cargo install codediff` and library consumers skip them.
stats = [
    "dep:git2",
    "dep:rusqlite",
    "dep:crossbeam-channel",
    "dep:libc",
    "dep:num_cpus",
    "dep:rand",
    "dep:indoc",
    "dep:walkdir",
    "test-fixtures",
]
# The browser front end, `codediff-web`. Implies `tui`, whose diff assembly, config persistence
# and highlighting it reuses, and adds no dependency of its own (see src/web/http.rs). Off by
# default.
web = ["tui"]

# `benchmark_other`'s harness end to end, through the stand-in `fake_diff_tool`. In tests/ because
# `CARGO_BIN_EXE_<name>` is only set for integration tests.
[[test]]
name = "benchmark_other_e2e"
path = "tests/benchmark_other_e2e.rs"
# Both binaries it spawns are gated this way, and so is the `csv` crate it reads results with, so
# a bare `cargo test` skips this target instead of failing to build.
required-features = ["test-fixtures"]

[[bin]]
name = "codediff"
path = "src/main.rs"
required-features = ["tui"]

[[bin]]
name = "codediff-web"
path = "src/web_main.rs"
required-features = ["web"]

[[bin]]
name = "render_tui_screenshot"
path = "src/bin/render_tui_screenshot.rs"
# The README's screenshot (`make readme-screenshot`), drawn by the TUI's own widgets.
required-features = ["tui"]

[[bin]]
name = "ascii_visualizer"
path = "src/bin/ascii_visualizer.rs"
# Checkout-only dev tool; `test-fixtures` is the general gate for those.
required-features = ["test-fixtures"]

[[bin]]
name = "human_solver"
path = "src/bin/human_solver/main.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "benchmark_optimal_solutions"
path = "src/bin/benchmark_optimal_solutions.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "benchmark_other"
path = "src/bin/benchmark_other.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "generate_mapping_site"
path = "src/bin/generate_mapping_site.rs"
required-features = ["test-fixtures"]

[[bin]]
# The GitHub Pages showcase: twenty fixture changes baked into static JSON in the exact shape
# codediff-web's page consumes, so the real browser viewer runs on Pages with no server - one
# JSON per case as `diff` marks it and as codediff maps it. `web` for the payload and the page
# assets, `test-fixtures` for the corpus and the unix-diff labeller.
name = "generate_showcase"
path = "src/bin/generate_showcase.rs"
required-features = ["test-fixtures", "web"]

[[bin]]
# Research-only: scores codediff against the Alikhanifard & Tsantalis AST node-mapping oracle
# (see research/external/README.md). Needs `csv`, hence the gate; touches nothing in the product.
name = "benchmark_astdiff_oracle"
path = "src/bin/benchmark_astdiff_oracle.rs"
required-features = ["test-fixtures"]

[[bin]]
# Not a diff tool: a stand-in that answers predictably (nothing changed / everything changed /
# a per-line hash / a crash) so `benchmark_other`'s harness can be scored against arithmetic
# instead of against a real tool whose correct answer nobody knows. Speaks difftastic's JSON, so
# `DIFFT_BIN` points at it and a real adapter is what runs. See tests/benchmark_other_e2e.rs.
name = "fake_diff_tool"
path = "src/bin/fake_diff_tool.rs"
# Checkout-only dev tool; see ascii_visualizer.
required-features = ["test-fixtures"]

[[bin]]
name = "diff_inventory"
path = "src/bin/diff_inventory.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "analyze_human_mappings"
path = "src/bin/analyze_human_mappings.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "apted_only_worker"
path = "src/bin/apted_only_worker.rs"
# Spawned by apted_only_benchmark; checkout-only dev tool, see ascii_visualizer.
required-features = ["test-fixtures"]

[[bin]]
name = "apted_only_benchmark"
path = "src/bin/apted_only_benchmark.rs"
# Needs git2 (repo/blob access, same as benchmark_diff_pairs) and csv - both gated by `stats`.
required-features = ["stats"]

[[bin]]
name = "commit_stats"
path = "src/bin/commit_stats.rs"
required-features = ["stats"]

[[bin]]
name = "materialize_test_diffs"
path = "src/bin/materialize_test_diffs.rs"
required-features = ["stats"]

[[bin]]
name = "benchmark_diff_pairs"
path = "src/bin/benchmark_diff_pairs.rs"
required-features = ["stats"]

[[bin]]
name = "file_stats"
path = "src/bin/file_stats.rs"
required-features = ["stats"]

[[bin]]
name = "reclassify_tips"
path = "src/bin/reclassify_tips.rs"
required-features = ["stats"]

[[bin]]
name = "sample_test_diffs"
path = "src/bin/sample_test_diffs.rs"
required-features = ["stats"]

[[bin]]
name = "sample_code_pairs"
path = "src/bin/sample_code_pairs.rs"
required-features = ["stats"]




