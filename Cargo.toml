[package]
name = "codediff"
version = "0.0.3"
edition = "2024"
rust-version = "1.85"
description = "Fast, robust, syntax-aware code diffing using tree-sitter ASTs"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ivankovic/codediff"
readme = "README.md"
keywords = ["diff", "ast", "tree-sitter", "cli", "git"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
exclude = [
    "research/**",
    # Checkout-only: the six `stats`-feature [[bin]] targets below cannot be built from the
    # published/packaged crate once their source is excluded here (confirmed via `cargo package`
    # + a build against the extracted tarball with `--features stats`: cargo reports no such bin
    # target at all). That's intentional - these are dataset-analysis dev tools, not part of the
    # published product (see README's Installation section) - but nothing else signals this
    # boundary, so `cargo install codediff --features stats` fails with a confusing error rather
    # than an explanatory one. Noted here for whoever next touches this.
    "src/bin/**",
    "src/test/data/**",
]

# No [profile.release] section existed before this (2026-07-25, speed-goal investigation) - Cargo's
# own defaults (codegen-units = 16, lto = false) leave real, free performance on the table for a
# CPU-bound algorithmic tool like this one. `lto = "fat"` lets the optimizer see across crate
# boundaries (tree-sitter, the APTED engine's own module split); `codegen-units = 1` trades slower
# release builds for better cross-function inlining within this crate. Pure compiler-flag change -
# zero source code touched, output is bit-for-bit the same algorithm, so this carries none of the
# correctness risk a concurrency or algorithmic change would.
[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
confy = "2.0.0"
crossbeam-channel = "0.5.15"
csv = "1.4.0"
git2 = { version = "0.20.3", optional = true }
indoc = "2.0.7"
libc = "0.2"
num_cpus = "1.17.0"
rand = "0.8"
regex = "1.12.2"
# Bundled/C-compiled, and (like git2 just above) only used by two of the stats-gated src/bin/
# tools (commit_stats.rs, file_stats.rs) - gated the same way for the same reason: the main
# codediff binary/library has no use for it, so it shouldn't be a mandatory build-time cost for
# every `cargo install`/library consumer.
rusqlite = { version = "0.37.0", features = ["bundled"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10.1"
futures = "0.3"
tokio = { version = "1.0", features = ["full"] }
tree-sitter = "0.25"
ratatui = { version = "0.26.3", features = ["serde", "macros"]}
crossterm = { version = "0.27.0", features = ["serde", "event-stream"]}
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.2"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-r = "1.2"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-vim = "0.4"
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7"
walkdir = "2"
metrohash = "1.0.7"
rustc-hash = "2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "serde"]}
tracing-error = "0.2.1"
strum = { version = "0.28.0", features = ["derive"] }
signal-hook = "0.4.4"
syntect = { version = "5.2", features = ["default-fancy"] }

[dev-dependencies]
insta = "1.38.0"

[features]
default = []
# Pulls in git2 (and its openssl/libssh2 build-time deps) and rusqlite (a bundled, C-compiled
# SQLite) for the git-history stats/sampling tools in src/bin/. Not needed by the main codediff
# binary or TUI, so it's opt-in to keep `cargo install codediff` and library consumers free of
# that dependency chain by default.
stats = ["dep:git2", "dep:rusqlite"]

[[bin]]
name = "commit_stats"
path = "src/bin/commit_stats.rs"
required-features = ["stats"]

[[bin]]
name = "materialize_test_diffs"
path = "src/bin/materialize_test_diffs.rs"
required-features = ["stats"]

[[bin]]
name = "benchmark_diff_pairs"
path = "src/bin/benchmark_diff_pairs.rs"
required-features = ["stats"]

[[bin]]
name = "file_stats"
path = "src/bin/file_stats.rs"
required-features = ["stats"]

[[bin]]
name = "sample_test_diffs"
path = "src/bin/sample_test_diffs.rs"
required-features = ["stats"]

[[bin]]
name = "sample_code_pairs"
path = "src/bin/sample_code_pairs.rs"
required-features = ["stats"]

[[bench]]
name = "hash_benchmark"
harness = false

[[bench]]
name = "optimal_iud_benchmark"
harness = false

[[bench]]
name = "diff_code_benchmark"
harness = false

[dev-dependencies.criterion]
version = "0.5"
features = ["html_reports"]



